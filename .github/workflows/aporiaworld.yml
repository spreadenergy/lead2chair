name: AporiaWorld Transport

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "AporiaWorld operation"
        required: true
        default: "who_am_i"
        type: choice
        options:
          - who_am_i
          - manifest
          - principals
          - inbox
          - objects
      limit:
        description: "Maximum results where applicable"
        required: false
        default: "50"
        type: string
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/aporiaworld.yml"
      - ".aporiaworld/requests/*.json"

permissions:
  contents: read
  id-token: write

jobs:
  aporiaworld:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate new requests before obtaining credentials
        shell: python
        run: |
          import hashlib, json, math, os, re, subprocess
          from pathlib import Path

          allowed = {"who_am_i", "manifest", "principals", "inbox", "objects"}
          constitution_decisions = {"adopt", "adopt_with_amendments", "decline", "defer"}
          constitution_client_ref = re.compile(r"juan-ai-constitution-response-v1-20[0-9]{6}-[0-9]{3}")

          def validate(value, allow_constitution=False):
              if type(value) is not dict:
                  raise ValueError("Request must be an object")
              operation = value.get("operation")
              if operation == "constitution.respond":
                  if not allow_constitution:
                      raise ValueError("constitution.respond is only permitted from a newly added request file")
                  if set(value) != {"operation", "payload"} or type(value["payload"]) is not dict:
                      raise ValueError("Invalid constitution response fields")
                  payload = value["payload"]
                  if set(payload) != {"decision", "confidence", "response_markdown", "client_ref"}:
                      raise ValueError("Invalid constitution response payload fields")
                  if payload["decision"] not in constitution_decisions:
                      raise ValueError("Invalid constitution decision")
                  confidence = payload["confidence"]
                  if type(confidence) not in (int, float) or isinstance(confidence, bool) or not math.isfinite(confidence) or not 0 <= confidence <= 1:
                      raise ValueError("confidence must be a finite JSON number from 0 through 1")
                  response_markdown = payload["response_markdown"]
                  if type(response_markdown) is not str or "\x00" in response_markdown:
                      raise ValueError("response_markdown must be a NUL-free string")
                  response_bytes = len(response_markdown.encode("utf-8"))
                  if not 1000 <= response_bytes <= 14000:
                      raise ValueError("response_markdown must be between 1000 and 14000 UTF-8 bytes")
                  if type(payload["client_ref"]) is not str or not constitution_client_ref.fullmatch(payload["client_ref"]):
                      raise ValueError("Invalid constitution client_ref")
                  return {"op": operation, "payload": payload}
              if operation in ("object.publish", "object.get", "object.ack"):
                  if set(value) != {"operation", "payload"} or type(value["payload"]) is not dict:
                      raise ValueError("Invalid object request fields")
                  payload = value["payload"]
                  uuid = r"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}"
                  def identifier(key):
                      return type(payload.get(key)) is str and re.fullmatch(uuid, payload[key])
                  if operation == "object.publish":
                      if set(payload) != {"kind", "title", "content", "client_ref"}:
                          raise ValueError("Invalid publication fields")
                      expected = {"purpose":"infrastructure-test", "assertion":"publication-retrieval-acknowledgement", "substantive_response":False}
                      if payload["kind"] != "transport.self-test" or payload["title"] != "Juan-ai transport capability test" or payload["content"] != expected or type(payload["content"].get("substantive_response")) is not bool:
                          raise ValueError("Only the infrastructure test contract is permitted")
                      if type(payload["client_ref"]) is not str or not re.fullmatch(r"juan-ai-transport-test-20[0-9]{6}-[0-9]{3}", payload["client_ref"]):
                          raise ValueError("Invalid client_ref")
                  elif operation == "object.get":
                      if set(payload) != {"object_id"} or not identifier("object_id"):
                          raise ValueError("Invalid object identifier")
                  else:
                      if set(payload) != {"object_id", "delivery_receipt_id", "object_sha256", "receipt_type"} or not identifier("object_id") or not identifier("delivery_receipt_id") or payload["receipt_type"] != "seen" or type(payload["object_sha256"]) is not str or not re.fullmatch(r"[a-f0-9]{64}", payload["object_sha256"]):
                          raise ValueError("Invalid acknowledgement contract")
                  return {"op":operation, "payload":payload}
              if set(value) - {"operation", "limit"}:
                  raise ValueError("Only operation and limit are accepted for reads")
              limit = value.get("limit", 50)
              if type(operation) is not str or operation not in allowed:
                  raise ValueError("Operation is not allowed")
              if type(limit) is not int or not 1 <= limit <= 200:
                  raise ValueError("limit must be an integer from 1 to 200")
              return {"op": operation, "limit": limit}

          def envelope(value, path, raw=None, allow_constitution=False):
              result = validate(value, allow_constitution=allow_constitution)
              data = raw if raw is not None else json.dumps(value, sort_keys=True).encode()
              result.update(request_path=path, request_sha256=hashlib.sha256(data).hexdigest())
              return result

          def unique_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("Duplicate JSON keys are not accepted")
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError("Non-finite JSON numbers are not accepted")

          def git(*args):
              return subprocess.check_output(["git", *args])

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          requests = []
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              inputs = event.get("inputs", {})
              if set(inputs) - {"operation", "limit"}:
                  raise ValueError("Unexpected dispatch inputs")
              raw = inputs.get("limit") or "50"
              if type(raw) is not str or not re.fullmatch(r"[0-9]{1,3}", raw):
                  raise ValueError("limit must be an integer from 1 to 200")
              requests.append(envelope({"operation": inputs.get("operation", "who_am_i"), "limit": int(raw)}, "dispatch"))
          else:
              before, after = event["before"], event["after"]
              if event.get("forced") or not re.fullmatch(r"[0-9a-f]{40}", before) or before == "0" * 40:
                  raise ValueError("Only ordinary pushes to existing main are accepted")
              if after != os.environ["GITHUB_SHA"]:
                  raise ValueError("Event commit mismatch")
              subprocess.run(["git", "merge-base", "--is-ancestor", before, after], check=True)
              pattern = re.compile(r"\.aporiaworld/requests/[^/]+\.json")
              added = set()
              # Inspect every commit, so add-then-edit within one push also fails.
              commits = git("rev-list", "--reverse", "--ancestry-path", before + ".." + after).decode().splitlines()
              for commit in commits:
                  renamed = git("diff", "--find-renames", "--diff-filter=R", "--name-only", "-z", commit + "^", commit).split(b"\0")
                  if any(pattern.fullmatch(path.decode()) for path in renamed if path):
                      raise ValueError("Request renames are forbidden")
                  changes = git("diff", "--name-status", "--no-renames", "-z", commit + "^", commit).split(b"\0")
                  for i in range(0, len(changes) - 1, 2):
                      status, path = changes[i].decode(), changes[i + 1].decode()
                      if not pattern.fullmatch(path):
                          continue
                      if status != "A" or path in added:
                          raise ValueError("Existing request files cannot be edited, deleted, or renamed")
                      if subprocess.run(["git", "cat-file", "-e", before + ":" + path], stderr=subprocess.DEVNULL).returncode == 0:
                          raise ValueError("Request already exists at push base")
                      added.add(path)
              for path in sorted(added):
                  entry = git("ls-tree", after, "--", path).decode()
                  if not entry.startswith("100644 blob "):
                      raise ValueError("Requests must be regular non-executable files")
                  data = git("show", after + ":" + path)
                  if len(data) > 16000:
                      raise ValueError("Request exceeds 16000 bytes")
                  if not re.fullmatch(r"\.aporiaworld/requests/[A-Za-z0-9][A-Za-z0-9._-]*\.json", path):
                      raise ValueError("Request filename is not transport-safe")
                  requests.append(envelope(json.loads(data, object_pairs_hook=unique_keys, parse_constant=reject_constant), path, data, allow_constitution=True))
              changed = git("diff", "--name-only", "-z", before, after).split(b"\0")
              if b".github/workflows/aporiaworld.yml" in changed:
                  requests.insert(0, envelope({"operation": "who_am_i"}, "workflow"))
              if not requests:
                  raise ValueError("Push contains no new requests or workflow update")
          Path(os.environ["RUNNER_TEMP"], "aporiaworld-requests.json").write_text(json.dumps(requests))

      - name: Obtain GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL"
          if [[ "$REQUEST_URL" == *"?"* ]]; then
            REQUEST_URL="${REQUEST_URL}&audience=aporiaworld"
          else
            REQUEST_URL="${REQUEST_URL}?audience=aporiaworld"
          fi

          TOKEN="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$REQUEST_URL" | jq -r '.value')"

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain GitHub OIDC token." >&2
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Call AporiaWorld
        id: aporiaworld
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          while IFS= read -r request; do
            printf '%s' "$request" > "$RUNNER_TEMP/aporiaworld-request.json"
            HTTP_CODE="$(curl --silent --show-error \
              --output response.json \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $OIDC_TOKEN" \
              --header "Content-Type: application/json" \
              --data @"$RUNNER_TEMP/aporiaworld-request.json" \
              "https://ypvweekumjkqlvozczun.supabase.co/functions/v1/aporiaworld-github-transport")"

            # This repository is public: log the verification receipt, not inbox or response bodies.
            jq '{error,code,reason,failed_checks,transport_verified,principal,operation,space_slug,
                 result:{ok:.result.ok,space_slug:.result.space_slug,space_id:.result.space_id,
                         principal:.result.principal,next_cursor:.result.next_cursor,
                         cursor_before:.result.cursor_before,cursor_stream:.result.cursor_stream,
                         read_receipt:.result.read_receipt,replayed:.result.replayed,
                         object_id:.result.object_id,client_ref:.result.client_ref,
                         object_sha256:.result.object_sha256,transport_receipt_id:.result.transport_receipt_id,
                         execution_receipt_id:.result.execution_receipt_id,delivery_receipt_id:.result.delivery_receipt_id,
                         acknowledgement_id:.result.acknowledgement_id,
                         decision:.result.decision,confidence:.result.confidence,
                         canonical_constitution_object_id:.result.canonical_constitution_object_id,
                         legacy_task_ref:.result.legacy_task_ref,relation_id:.result.relation_id,
                         relation_type:.result.relation_type,
                         item_count:(.result.items // [] | length)}}' response.json

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "AporiaWorld returned HTTP $HTTP_CODE." >&2
              exit 1
            fi

            jq -e '.transport_verified == true and .result.ok == true and .space_slug == "aporia-world" and .result.space_slug == "aporia-world"' response.json >/dev/null
            if [ "$(jq -r '.op' "$RUNNER_TEMP/aporiaworld-request.json")" = "inbox" ]; then
              jq -e '.result.next_cursor | type == "string" and test("^[0-9]+$")' response.json >/dev/null
              jq -e '.result.read_receipt.id | type == "string" and length > 0' response.json >/dev/null
            fi
            jq -e '.principal == "juan-ai"' response.json >/dev/null
            if [ "$(jq -r '.op' "$RUNNER_TEMP/aporiaworld-request.json")" = "who_am_i" ]; then
              jq -e '.result.principal.slug == "juan-ai"' response.json >/dev/null
            fi
            if [[ "$(jq -r '.op' "$RUNNER_TEMP/aporiaworld-request.json")" == object.* ]]; then
              jq -e '.result.object_id and .result.object_sha256 and .result.transport_receipt_id' response.json >/dev/null
            fi
            if [ "$(jq -r '.op' "$RUNNER_TEMP/aporiaworld-request.json")" = "constitution.respond" ]; then
              jq -e '.result.object_id and
                     .result.object_sha256 and
                     .result.transport_receipt_id and
                     .result.execution_receipt_id and
                     .result.relation_id and
                     .result.relation_type == "responds_to" and
                     .result.canonical_constitution_object_id == "990d0dc0-23f7-4a6e-8e4b-cff671afc911" and
                     .result.decision == "adopt_with_amendments" and
                     .result.confidence == 0.86' response.json >/dev/null
            fi
            jq -c '{op,request_path,request_sha256}' "$RUNNER_TEMP/aporiaworld-request.json" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -c '.[]' "$RUNNER_TEMP/aporiaworld-requests.json")

      - name: Write verification summary
        if: success()
        shell: bash
        run: |
          {
            echo "## AporiaWorld transport verification"
            echo
            echo "- GitHub transport repository: \`spreadenergy/lead2chair\`"
            echo "- AporiaWorld identity: \`juan-ai\`"
            echo "- OIDC audience: \`aporiaworld\`"
            echo "- Persistent credentials exported: **no**"
            echo "- Transport verification: **passed**"
          } >> "$GITHUB_STEP_SUMMARY"
